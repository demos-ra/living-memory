[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "living-memory"
version = "0.0.0"
description = "JSON described by a JSON Schema, converted to Multi-Sheet Tab-Separated Values (MTSV)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "tools/anthropic_sdk/LICENSE"]
authors = [{ name = "Demos Ra", email = "demos_ra@hotmail.com" }]
keywords = ["mtsv", "tsv", "tabular data", "json", "json schema"]
dependencies = ["mtsv>=0.6"]

[project.scripts]
living-memory = "living_memory._command:main"
