[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "living-memory"
version = "0.0.0"
description = "Multi-Sheet Tab-Separated Values (MTSV) for the text around AI models"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Demos Ra", email = "demos_ra@hotmail.com" }]
keywords = ["mtsv", "tsv", "tabular data", "opentelemetry", "generative ai"]
dependencies = ["mtsv>=0.6"]

[project.scripts]
living-memory = "living_memory.__main__:main"
